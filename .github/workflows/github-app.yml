name: Publicação Lorekeeper PR Bot

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: [CI, Sinalizar branch Lorekeeper]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: lorekeeper-pr-bot-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'schedule' || (
          github.event.workflow_run.head_repository.full_name == github.repository && (
            (github.event.workflow_run.path == '.github/workflows/ci.yml' &&
              github.event.workflow_run.event == 'pull_request') ||
            (github.event.workflow_run.path == '.github/workflows/notify-codex-branch.yml' &&
              github.event.workflow_run.event == 'push' &&
              github.event.workflow_run.conclusion == 'success' &&
              startsWith(github.event.workflow_run.head_branch, 'codex/'))
          )
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ vars.LOREKEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOREKEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - run: node .github/scripts/github-app.mjs
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
